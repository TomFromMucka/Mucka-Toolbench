appId: ai.mucka.toolbench
productName: Mucka Toolbench
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Seeds Contents/Resources/app-update.yml before signing. electron-builder
# only generates that file on a run that actually publishes, so without
# this a `build:mac` app has no updater config and electron-updater fails
# at startup with ENOENT. It can't be added afterwards — Resources is
# inside the code seal. See build/app-update.yml.
extraResources:
  - from: build/app-update.yml
    to: app-update.yml
asarUnpack:
  - resources/**
  - 'node_modules/@anthropic-ai/claude-agent-sdk/**'
  # The per-platform native `claude` binary the SDK spawns — must live
  # outside the asar or spawn fails with ENOTDIR.
  - 'node_modules/@anthropic-ai/claude-agent-sdk-*/**'
win:
  executableName: Mucka Toolbench
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Pinned deliberately. Squirrel's designated requirement includes the
  # team identifier, so an update signed by a different Apple account can
  # never validate against an installed build — the in-app update just
  # fails at install time with "code failed to satisfy specified code
  # requirement(s)". That is what stranded 0.4.0 on disk: it was signed
  # by team 5J838DR8CA, 0.5.0 by Q37JNZCSRD. Pinning means a keychain
  # that can't supply this identity fails the build loudly instead of
  # quietly shipping a release nobody can update to.
  identity: "Apple Development: Thomas Webster (TD8AYA5K8T)"  # team Q37JNZCSRD
  # zip-only by default. The auto-updater (electron-updater) only reads
  # the zip + latest-mac.yml, so the DMG was purely a fresh-install
  # nicety — and dmgbuild's "hdiutil couldn't unmount, Resource busy"
  # flake was costing a release every other ship. Re-add DMG before
  # the repo goes public so external users get the drag-to-Applications
  # window.
  target:
    - zip
  # Space-free, like nsis/appImage below. The default
  # `${productName}-…` pattern puts a space in the filename; GitHub
  # rewrites spaces to dots on upload, so electron-builder's
  # "already uploaded?" check compares `Mucka Toolbench-….blockmap`
  # against the stored `Mucka.Toolbench-….blockmap`, never matches, and
  # a retried publish dies with 422 already_exists — leaving a release
  # with assets missing. Cost us a botched publish on 0.4.0.
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: TomFromMucka
  repo: Mucka-Toolbench
  releaseType: release
